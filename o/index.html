<html>
    <head>
        <meta charset="utf-8">
        <title>オセロ</title>
    </head>
    <body>
        <div id="main">
            <span id="rotate">
                <table>
                    <tbody id="screen">
                        
                    </tbody>
                </table>
            </span>
            <div id="log">

            </div>
            <button onclick="pass()">パス</button>
            <div id="w">

            </div>
        </div>
        <style>
#log{
    padding: 1.3rem;
    padding-top:4rem;
}
#main {
    text-align: center;
    padding: 0px auto;
}
#rotate {
    padding-top:4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin:0px auto;
}
#screen td {
    border: 1px solid;
    width: 3rem;
    height: 3rem;
    text-align: center;
}
        </style>
        <script>
const selm = document.querySelector("#screen");
const lg = document.querySelector("#log");
const SCREEN_WIDTH = 8 ;
const SCREEN_HEIGHT = 8 ;

let turn = false ;
let timeScale = 0 ;

const m = new Int8Array(2*SCREEN_HEIGHT*SCREEN_WIDTH);

function set_item (x,y,b,s) {
    const b_index = (y*SCREEN_WIDTH+x)*2 ;
    if(
        !((0 <= x && x < SCREEN_WIDTH ) &&
        (0 <= y && y < SCREEN_HEIGHT ))
    ){
        return ;
    }
    
    const statu_index = b_index + 1 ;
    m[b_index] = b ;
    m[statu_index] = s ;
    return ;
}
function get_item (x,y) {
    const b_index = (y*SCREEN_WIDTH+x)*2 ;
    if(
            !((0 <= x && x < SCREEN_WIDTH ) &&
            (0 <= y && y < SCREEN_HEIGHT ))
        ){
        return [255,255] ;
    }
    const statu_index = b_index + 1 ;
    return [m[b_index],m[statu_index]] ;
}

function reversible (x,y){
    let result = [] ;
    // ｷﾓ
    result = result.concat(_reversible_component(x,y,0,1)) ;
    result = result.concat(_reversible_component(x,y,0,-1)) ;
    result = result.concat(_reversible_component(x,y,1,0)) ;
    result = result.concat(_reversible_component(x,y,-1,0)) ;
    result = result.concat(_reversible_component(x,y,1,1)) ;
    result = result.concat(_reversible_component(x,y,-1,1)) ;
    result = result.concat(_reversible_component(x,y,-1,-1)) ;
    result = result.concat(_reversible_component(x,y,1,-1)) ;
    return result ;
}
function _reversible_component (x,y,dx,dy) {
    let i = 1 ;
    const rev = [] ;
    while(true){
        const item = get_item(x+dx*i,y+dy*i) ;
        if(item[0]==255 || item[0]==1 || item[0]==0){
            return [] ;
        }
        if(item[0]==2 )
            if(item[1] == turn){
                return rev ;
            }else{
                rev.push([x+dx*i,y+dy*i]);
            }
        i ++ ;
        if(i>10){
            console.error("繰り返しエラー")
            return ;
        }
    }
}
set_item(3,3,2,0) ;
set_item(3,4,2,1) ;
set_item(4,3,2,1) ;
set_item(4,4,2,0) ;

function render (){
    let str = "";
    for(let i = 0 ;i < SCREEN_HEIGHT ; i ++){
        str += "<tr>";
        for(let j = 0 ; j < SCREEN_WIDTH ; j ++){
            const item = get_item(j,i);
            let color_2 = "rgb(7, 41, 7,0.78)" ;
            if(item[0] == 1){
                color_2 = "rgb(17, 80, 17,0.78)" ;
            }
            str += `<td onclick="push_table(${j},${i})" style="color:white;background:${color_2};">`;
            if(item[0]==2){
                let color = "" ;
                if (item[1] == 0) {
                    color = "black" ;
                }else{
                    color = "white" ;
                }
                str += `
                    <div style="border-radius:50%;width:2rem;height:2rem;border:2px solid;color:white;background:${color};"></div>
                `;
            }
            str += "</td>";
        }
        str += "</tr>";
    }
    if( selm != null ){
        selm.innerHTML = str ;
    }
    lg_renderer();
    return ;
}
function check_fin () {
    let f = 0 ;
    let s = 0 ;
    for(let i = 0 ; i < m.length ; i +=2) {
        const elm = m[i] ;
        if(elm == 2){
            if(m[i+1] ){
                f++;
            }else{
                s++;
            }
        }else{
            return [f,s] ;
        }
    }
    return [f,s] ;
}
function push_table(x,y){
    const item = get_item(x,y) ;
    if(item[0] == 255){
        return ;
    }
    if (item[0]==0){
        const rv = reversible(x,y) ;
        if(rv.length == 0){
            return ;
        }
        set_item(x,y,2,turn) ;
        timeScale ++ ;
        for(let i = 0 ; i < rv.length ; i++ ){
            set_item(rv[i][0],rv[i][1],2,turn) ;
        }
        const c = check_fin() ;
        if(c[0]+c[1] >= SCREEN_HEIGHT*SCREEN_WIDTH){
            const win = document.querySelector("#w");
            let w = "<span style='color:white;background:black;border-radius:50%;padding:0.5rem;border:4px solid;'>黒</span>" ;
            if(c[0] > c[1]){
                w = "<span style='color:black;background:white;border-radius:50%;padding:0.5rem;border:4px solid;'>白</span>" ;
            }
            win.innerHTML = `<p style="font-size:1.6rem;">${c[0]}対${c[1]}で${w}の勝利</p>`;
        }
        turn = !turn ;
        render();
        return ;
    }
    // for(let i = 0 ; i < m.length ; i += 2){
    //     if(m[i] == 1 ){
    //         m[i] = 0 ;
    //     }
    // }
    // if (item[0]==0){
    //     set_item(x,y,2,item[1])
    // }
    render();
}

function lg_renderer () {
    let t = "<span style='color:white;background:black;border-radius:50%;padding:0.5rem;border:4px solid;'>黒</span>" ;
    if(turn){
        t = "<span style='color:black;background:white;border-radius:50%;padding:0.5rem;border:4px solid;'>白</span>";
    }
    lg.innerHTML = `
        <p style="font-size:1.6rem;">手番:${t}</p>
    `;
}
function pass (){
    turn = !turn ;
    render();
}

render();

const screen_back = document.querySelector("#rotate");
let time = Date.now() ;
let utime = 0 ;
setInterval(function(){
    const now = Date.now() ;
    const delta = now - time ;
    time = now ;
    utime += delta ;

    const x = timeScale*utime*0.001 ;
    screen_back.style.transform = `rotateZ(${x}deg) scale(${Math.abs(Math.cos(x*0.01))})`;
},20) ;
        </script>
